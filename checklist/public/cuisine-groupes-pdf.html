<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bœuf & Cow — Groupes à venir (30 jours)</title>
  <style>
    :root { --dark: #1f2120; --gold: #c59d5f; --gold-dark: #8a6b32; --muted: #5a5550; --red: #bf272d; --border: #ded8cd; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--dark); background: #fff; padding: 18px 20px 40px; }
    .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    .bar a, .bar button { font: inherit; font-weight: 800; font-size: .9rem; border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; text-decoration: none; }
    .bar button { background: var(--red); color: #fff; }
    .bar button.secondary { background: #eee7db; color: var(--dark); }
    .bar a { background: #eee7db; color: var(--dark); }
    .hint { color: var(--muted); font-size: .85rem; margin: -6px 0 14px; }
    @media print { .hint { display: none; } }
    h1 { font-size: 1.25rem; margin: 0 0 2px; text-transform: uppercase; letter-spacing: .04em; }
    .sub { color: var(--muted); font-size: .9rem; margin: 0 0 18px; }
    .day { break-inside: avoid; margin: 0 0 14px; border: 1.5px solid var(--border); border-radius: 10px; overflow: hidden; }
    .day h2 { margin: 0; padding: 7px 12px; background: #f3f0ea; font-size: .95rem; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1.5px solid var(--border); }
    .day h2 .n { float: right; color: var(--gold-dark); font-weight: 700; text-transform: none; letter-spacing: 0; }
    .g { padding: 8px 12px; border-top: 1px solid #ece7de; }
    .g:first-of-type { border-top: 0; }
    .g .t { font-weight: 800; font-size: 1rem; }
    .g .t .heure { color: var(--gold-dark); font-weight: 800; margin-left: 8px; }
    .g .t .pers { color: var(--gold-dark); font-weight: 700; margin-left: 8px; }
    .g .t .prix { color: var(--muted); font-weight: 600; margin-left: 8px; }
    .g .l { font-size: .9rem; margin-top: 2px; line-height: 1.35; white-space: pre-line; }
    .g .l b { color: var(--muted); font-weight: 700; }
    .g.annule { opacity: .55; }
    .g.annule .t::before { content: "ANNULÉ — "; color: var(--red); }
    .empty { color: var(--muted); padding: 20px 0; }
    .total { margin-top: 10px; color: var(--muted); font-size: .85rem; }
    @media print {
      body { padding: 0; }
      .bar { display: none; }
      .day { page-break-inside: avoid; }
      @page { size: A4 portrait; margin: 12mm; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="bar">
    <button id="share" type="button">📤 Enregistrer / Partager le PDF</button>
    <button id="print" type="button" class="secondary">🖨️ Imprimer</button>
    <a href="cuisine-groupes.html">← Retour aux groupes</a>
  </div>
  <p class="hint" id="hint" hidden></p>
  <h1>👥 Groupes à venir</h1>
  <p class="sub" id="sub">Chargement…</p>
  <div id="content"></div>

  <script>
    'use strict';
    const DAYS = 30;
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const JOURS = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
    const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
    function longDate(iso) {
      const d = new Date(iso + 'T12:00:00');
      return `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}`;
    }
    function shortDate(iso) { const d = new Date(iso + 'T12:00:00'); return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`; }
    // Heure d'un groupe : champ « Heure d'arrivée », sinon l'heure écrite au DÉBUT
    // des infos (ex. « 21:00 – Dîner samedi · Tables… », « 12h30 … », « 19h … »).
    function withHeure(g) {
      if (g && !g.heure) {
        const m = /^\s*(\d{1,2})\s*[:hH]\s*(\d{2})?(?!\d)/.exec(g.infos || '');
        if (m && Number(m[1]) < 24 && Number(m[2] || 0) < 60) g.heure = `${m[1].padStart(2, '0')}:${m[2] || '00'}`;
      }
      return g;
    }
    function parseGroups(raw) {
      if (!raw) return [];
      try { const o = JSON.parse(raw); if (Array.isArray(o)) return o.filter((x) => x && typeof x === 'object').map(withHeure); if (o && typeof o === 'object') return [withHeure(o)]; }
      catch (e) { return [{ nom: String(raw) }]; }
      return [];
    }
    // PDF volontairement sobre : nom, personnes, heure et menu uniquement.
    const LINES = [['menu', 'Menu']];
    function groupHTML(g) {
      const head = `<div class="t">${esc(g.nom || '(sans nom)')}${g.pers ? `<span class="pers">${esc(g.pers)} pers</span>` : ''}${g.heure ? `<span class="heure">🕒 ${esc(String(g.heure).replace(':', 'h'))}</span>` : ''}</div>`;
      const lines = LINES.filter(([k]) => g[k] && String(g[k]).trim()).map(([k, l]) => `<div class="l"><b>${l} :</b> ${esc(g[k])}</div>`).join('');
      return `<div class="g${g.annule ? ' annule' : ''}">${head}${lines}</div>`;
    }
    (async () => {
      const content = document.getElementById('content');
      try {
        const d = await fetch(`api/menus?groupDays=${DAYS}`).then((r) => r.json());
        const dates = d.groupes || [];
        document.getElementById('sub').textContent = `Du ${shortDate(dates[0])} au ${shortDate(dates[dates.length - 1])} — édité le ${shortDate(d.today)}`;
        let total = 0;
        const blocks = dates.map((date) => {
          const arr = parseGroups(d.cells[date] && d.cells[date].groupe);
          if (!arr.length) return '';
          total += arr.filter((g) => !g.annule).length;
          const pers = arr.filter((g) => !g.annule).reduce((s, g) => s + (parseInt(g.pers, 10) || 0), 0);
          return `<section class="day"><h2>${longDate(date)}<span class="n">${arr.length} groupe${arr.length > 1 ? 's' : ''}${pers ? ` · ${pers} pers` : ''}</span></h2>${arr.map(groupHTML).join('')}</section>`;
        }).join('');
        content.innerHTML = blocks || '<div class="empty">Aucun groupe sur les 30 prochains jours.</div>';
        if (blocks) content.insertAdjacentHTML('beforeend', `<div class="total">${total} groupe${total > 1 ? 's' : ''} sur ${DAYS} jours (hors annulés).</div>`);
        window.__groupsData = { dates, cells: d.cells || {}, today: d.today }; // pour le PDF généré
      } catch (e) {
        content.innerHTML = '<div class="empty">Impossible de charger les groupes.</div>';
      }
      document.getElementById('print').addEventListener('click', () => window.print());
      // Sur ordinateur, ouvert avec ?print=1 : impression directe. Sur téléphone/tablette
      // (tactile), Safari bloque l'impression automatique → on passe par le PDF partagé.
      const touch = matchMedia('(pointer: coarse)').matches;
      if (!touch && new URLSearchParams(location.search).get('print') === '1') setTimeout(() => window.print(), 400);
      if (touch) { const h = document.getElementById('hint'); h.textContent = 'Sur iPhone / iPad : « Enregistrer / Partager le PDF » ouvre la feuille de partage (Fichiers, AirDrop, Mail, Imprimer…).'; h.hidden = false; }
    })();

    // --- PDF généré dans la page (jsPDF) : fonctionne sur iPhone, même en app « écran d'accueil ».
    function buildPdf() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      const d = window.__groupsData || { dates: [], cells: {} };
      const W = 210, M = 14, maxW = W - 2 * M;
      let y = 18;
      const clean = (s) => String(s == null ? '' : s).replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '').trim();
      const line = (txt, size, style, color, indent) => {
        doc.setFont('helvetica', style || 'normal'); doc.setFontSize(size); doc.setTextColor(...(color || [31, 33, 32]));
        const rows = doc.splitTextToSize(clean(txt), maxW - (indent || 0));
        for (const r of rows) { if (y > 282) { doc.addPage(); y = 18; } doc.text(r, M + (indent || 0), y); y += size * 0.42 + 1.2; }
      };
      line('Boeuf & Cow — Groupes à venir', 16, 'bold');
      if (d.dates.length) line(`Du ${shortDate(d.dates[0])} au ${shortDate(d.dates[d.dates.length - 1])} — édité le ${shortDate(d.today)}`, 10, 'normal', [90, 85, 80]);
      y += 3;
      let total = 0;
      for (const date of d.dates) {
        const arr = parseGroups(d.cells[date] && d.cells[date].groupe);
        if (!arr.length) continue;
        const pers = arr.filter((g) => !g.annule).reduce((s, g) => s + (parseInt(g.pers, 10) || 0), 0);
        if (y > 265) { doc.addPage(); y = 18; }
        y += 2;
        doc.setFillColor(243, 240, 234); doc.rect(M, y - 4.5, maxW, 7, 'F');
        line(`${longDate(date).toUpperCase()}   —   ${arr.length} groupe${arr.length > 1 ? 's' : ''}${pers ? ` · ${pers} pers` : ''}`, 10, 'bold', [138, 107, 50]);
        y += 1;
        for (const g of arr) {
          total += g.annule ? 0 : 1;
          const head = `${g.nom || '(sans nom)'}${g.pers ? `   ${g.pers} pers` : ''}${g.heure ? `   ${String(g.heure).replace(':', 'h')}` : ''}${g.annule ? '   (ANNULÉ)' : ''}`;
          line(head, 11, 'bold', g.annule ? [150, 150, 150] : [31, 33, 32], 2);
          if (g.menu && String(g.menu).trim()) line('Menu : ' + g.menu, 9.5, 'normal', [60, 56, 52], 6);
          y += 1.5;
        }
      }
      y += 2; line(`${total} groupe${total > 1 ? 's' : ''} sur ${DAYS} jours (hors annulés).`, 9, 'italic', [90, 85, 80]);
      return doc;
    }
    document.getElementById('share').addEventListener('click', async () => {
      const btn = document.getElementById('share');
      try {
        btn.disabled = true; btn.textContent = '⏳ Préparation…';
        const doc = buildPdf();
        const name = `groupes-30-jours-${(window.__groupsData && window.__groupsData.today) || ''}.pdf`;
        const blob = doc.output('blob');
        const file = new File([blob], name, { type: 'application/pdf' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'Groupes à venir' });
        } else {
          // Pas de feuille de partage : ouverture / téléchargement du PDF.
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 60000);
        }
      } catch (e) {
        if (!/abort/i.test(String(e && e.name))) alert('Impossible de générer le PDF : ' + (e && e.message ? e.message : e));
      } finally { btn.disabled = false; btn.textContent = '📤 Enregistrer / Partager le PDF'; }
    });
  </script>
</body>
</html>
