<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bœuf & Cow — Check-lists Cuisine</title>
  <link rel="stylesheet" href="styles.css?v=25">
  <style>
    /* Cartouche « Ménage du jour » sous la progression globale. */
    .menage-box { display: block; background: #fff; border: 2px solid var(--gold); border-radius: 12px;
      padding: 12px 16px; margin: -6px 0 18px; color: var(--dark); text-decoration: none; }
    .menage-box .mh { display: flex; justify-content: space-between; align-items: center; font-size: .82rem;
      font-weight: 900; text-transform: uppercase; letter-spacing: .08em; color: var(--gold-dark); margin-bottom: 8px; }
    .menage-box .mh .mc { font-weight: 700; letter-spacing: 0; text-transform: none; color: var(--muted); font-size: .78rem; }
    /* Tâches cochables directement dans le cartouche. */
    .menage-box .mt { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 0;
      border: 0; background: none; text-align: left; font: inherit; font-size: .95rem; font-weight: 600;
      color: var(--dark); cursor: pointer; border-top: 1px solid #f1ece4; }
    .menage-box .mt:first-of-type { border-top: 0; }
    .menage-box .mt .cb { flex: 0 0 26px; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border);
      display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: .9rem; }
    .menage-box .mt.busy { opacity: .5; pointer-events: none; }
    .menage-box .mt.carried { color: #9e1f24; }
    .menage-box .mt small { color: var(--muted); font-weight: 500; }
    .menage-box .more { margin-top: 8px; font-size: .82rem; color: var(--gold-dark); font-weight: 700; text-decoration: none; display: inline-block; }
    .menage-box.done { border-color: var(--green); }
    .menage-box.done .mh { color: var(--green); }
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <div class="brand">
        <div class="logo">B</div>
        <span class="name">BŒUF <span class="amp">&amp;</span> COW</span>
        <span class="tag">Cuisine</span>
      </div>
      <nav class="nav-links">
        <a href="cuisine-accueil.html" class="back">🍳 Cuisine</a>
        <a href="cuisine.html" class="active">✅ Check-lists</a>
        <a href="cuisine-commandes-accueil.html">📦 Commandes</a>
        <a href="cuisine-groupes.html">👥 Groupes</a>
        <a href="cuisine-menudujour.html">📋 Menu de la semaine</a>
        <a href="cuisine-admin-accueil.html">⚙️ Admin</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div>
      <h1 class="page-title">Check-lists Cuisine</h1>
      <p class="page-sub" id="subtitle"></p>
    </div>

    <div class="global" id="global" hidden>
      <div class="row"><span class="lbl">Progression globale</span><span class="pct" id="global-pct">0%</span></div>
      <div class="bar"><i id="global-bar" style="width:0%"></i></div>
    </div>
    <!-- Cartouche « Ménage du jour » : les 3 prochaines tâches de ménage à faire,
         mis à jour automatiquement (toutes les 15 s et au retour sur la page). -->
    <div class="menage-box" id="menage-box" hidden></div>

    <div id="content"><div class="loading pulse">Chargement…</div></div>
  </main>

  <script src="cuisine.js?v=20"></script>
</body>
</html>
