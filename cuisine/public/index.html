<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning Cuisine — Boeuf &amp; Cow</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="brand-name">Bœuf <span class="amp">&amp;</span> Cow</span><span class="brand-tag">Planning Cuisine</span></div>
    <div>
      <a href="/">← Accueil</a>
      <a href="#" id="logout-link" style="display:none; margin-left:16px">Déconnexion</a>
    </div>
  </div>

  <div class="container">
    <!-- Connexion -->
    <div id="login-view" class="login-wrap" style="display:none">
      <div class="panel">
        <h2>Connexion</h2>
        <div class="field">
          <label for="login-password">Mot de passe</label>
          <input type="password" id="login-password" autocomplete="current-password" placeholder="••••••••">
        </div>
        <button class="btn btn-blue" id="login-btn" style="width:100%">Se connecter</button>
        <div class="msg error" id="login-msg"></div>
      </div>
      <a href="/" class="btn btn-ghost" style="display:block;width:100%;margin-top:14px;text-align:center;text-decoration:none">← Retour à l'accueil</a>
    </div>

    <!-- Tableau de bord -->
    <div id="admin-view" style="display:none">

      <!-- Période de la semaine affichée (lundi → dimanche), pilotée par la navigation. -->
      <input type="hidden" id="rep-from">
      <input type="hidden" id="rep-to">

      <div class="panel" id="planning-panel">
        <h2>Planning de la semaine<span class="wk-print-dates" id="wk-print-dates"></span></h2>
        <div class="row" style="margin-bottom:14px; align-items:center; gap:14px">
          <button class="btn btn-ghost" id="wk-prev" style="flex:0 0 auto">‹ Précédente</button>
          <div style="position:relative; min-width:190px; text-align:center; flex:0 0 auto">
            <div id="wk-label" style="font-weight:700; cursor:pointer" title="Cliquer pour choisir une semaine dans le calendrier"></div>
            <input type="date" id="wk-date" aria-label="Choisir une semaine" style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; border:0; padding:0; margin:0;">
          </div>
          <button class="btn btn-ghost" id="wk-next" style="flex:0 0 auto">Suivante ›</button>
          <button class="btn btn-green" id="tpl-btn" style="flex:0 0 auto">⚡ Semaine type</button>
          <button class="btn btn-blue" id="he-btn" style="flex:0 0 auto">🏖️ Hors entreprise</button>
          <button class="btn btn-green" id="grp-btn" style="flex:0 0 auto">👥 Arrivée groupée</button>
          <button class="btn btn-blue" id="pdf-btn" style="flex:0 0 auto">📄 PDF</button>
        </div>
        <div class="table-wrap"><div id="planning-output"></div></div>
      </div>

      <div class="panel">
        <h2>Employés</h2>
        <div class="row" style="margin-bottom:18px">
          <div class="field">
            <label for="new-name">Nom complet</label>
            <input type="text" id="new-name" placeholder="Ex. Sophie Bernard">
          </div>
          <div class="field" style="max-width:190px">
            <label for="new-cat">Catégorie</label>
            <select id="new-cat">
              <option value="chef">Chef</option>
              <option value="manager">Manager</option>
              <option value="chef_de_partie">Chef de partie</option>
              <option value="cuisinier" selected>Cuisinier</option>
              <option value="apprenti">Apprenti</option>
              <option value="plongeur">Plongeur</option>
            </select>
          </div>
          <button class="btn btn-green" id="add-btn" style="flex:0 0 auto">+ Ajouter</button>
        </div>
        <div class="msg error" id="emp-msg"></div>
        <div class="table-wrap">
          <table class="emp-table">
            <thead><tr><th></th><th>Nom</th><th>Catégorie</th><th>Statut</th><th style="text-align:right">Actions</th></tr></thead>
            <tbody id="emp-tbody"></tbody>
          </table>
          <div class="sub" style="font-size:.8rem;margin-top:8px">Glissez la poignée ⠿ pour réordonner — l'ordre s'applique au planning.</div>
        </div>
      </div>

      <div class="panel">
        <h2>Établissement</h2>
        <div class="row">
          <div class="field">
            <label for="estab-name">Nom du site (affiché en haut de l'application)</label>
            <input type="text" id="estab-name" placeholder="Ex. Boeuf & Cow">
          </div>
          <button class="btn btn-blue" id="estab-btn" style="flex:0 0 auto">Enregistrer</button>
        </div>
        <div class="msg" id="estab-msg"></div>
      </div>

      <div class="panel">
        <h2>Sécurité</h2>
        <div class="row">
          <div class="field">
            <label for="cur-pwd">Mot de passe actuel</label>
            <input type="password" id="cur-pwd" autocomplete="current-password">
          </div>
          <div class="field">
            <label for="new-pwd">Nouveau mot de passe</label>
            <input type="password" id="new-pwd" autocomplete="new-password">
          </div>
          <button class="btn btn-blue" id="pwd-btn" style="flex:0 0 auto">Modifier</button>
        </div>
        <div class="msg" id="pwd-msg"></div>
      </div>

    </div>
  </div>

  <!-- Éditeur de case du planning -->
  <div class="overlay" id="cell-overlay">
    <div class="modal" id="cell-modal"></div>
  </div>

  <!-- Profil salarié (repos, service continu) -->
  <div class="overlay" id="profile-overlay">
    <div class="modal" id="profile-modal"></div>
  </div>

  <script src="sortable.min.js"></script>
  <script src="admin.js"></script>
</body>
</html>
