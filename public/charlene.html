<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bœuf &amp; Cow — Charlène (Responsable en Chef)</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=9">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=9">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f4f0e8;
      --gold:#c59d5f; --gold-dark:#8a6b32; --primary:#bf272d;
      --dark:#1f2120; --muted:#5a5550;
      --card:#fff; --card-border:#e8e2d9;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg);
      color:var(--dark); min-height:100vh;
      display:flex; flex-direction:column; align-items:center;
      padding:max(28px,env(safe-area-inset-top)) 20px 48px;
    }
    .top{width:100%;max-width:720px;display:flex;align-items:center;gap:14px;margin:4px 0 22px}
    .top a.back{color:var(--gold-dark);text-decoration:none;font-weight:700;font-size:.95rem}
    .top h1{font-size:1.1rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dark)}
    .grid{width:100%; max-width:720px; display:grid; grid-template-columns:repeat(2,1fr); gap:16px;}
    @media (max-width:560px){ .grid{grid-template-columns:1fr} }
    .tile{
      display:flex; flex-direction:column; gap:10px;
      background:var(--card); border:2px solid var(--card-border);
      border-radius:20px; padding:24px 22px; min-height:140px;
      color:var(--dark); text-decoration:none;
      transition:transform .15s ease, border-color .15s ease;
      position:relative; overflow:hidden;
    }
    .tile:hover{transform:translateY(-3px);border-color:var(--gold)}
    .tile .ic{font-size:2rem;line-height:1}
    .tile .ttl{font-size:1.12rem;font-weight:700}
    .tile .sub{font-size:.85rem;color:var(--muted);line-height:1.35}
    .tile .accent{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--primary)}
    .tile.gold .accent{background:var(--gold)}
    .badge{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;letter-spacing:.06em;
      text-transform:uppercase;color:var(--gold-dark);background:#f6efe2;border-radius:999px;padding:3px 9px;width:max-content}
  </style>
</head>
<body>
  <div class="top">
    <a class="back" href="/">← Accueil</a>
    <h1>👸 Charlène <span style="font-weight:500;font-size:.85rem;letter-spacing:0;text-transform:none;color:var(--muted)">(Responsable en Chef)</span></h1>
  </div>

  <main class="grid">
    <a class="tile" href="/admin.html">
      <span class="accent"></span>
      <span class="ic">📅</span>
      <span class="badge">🔒 Protégé</span>
      <span class="ttl">Admin planning salle</span>
      <span class="sub">Planning de la semaine, horaires, statuts &amp; moyennes</span>
    </a>

    <a class="tile gold" href="/checklist/cuisine-groupes.html">
      <span class="accent"></span>
      <span class="ic">👥</span>
      <span class="ttl">Groupes</span>
      <span class="sub">Groupes à venir, jour par jour</span>
    </a>

    <a class="tile gold" href="/checklist/cuisine-menudujour.html">
      <span class="accent"></span>
      <span class="ic">📋</span>
      <span class="ttl">Menu de la semaine</span>
      <span class="sub">Menus de la semaine en cours &amp; prochaine</span>
    </a>
  </main>
  <script src="/tabbar.js?v=5"></script>
</body>
</html>
