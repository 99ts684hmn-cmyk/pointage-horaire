<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bœuf &amp; Cow — Managers Salle</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=9">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=9">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f4f0e8;
      --gold:#c59d5f; --gold-dark:#8a6b32; --primary:#bf272d;
      --dark:#1f2120; --muted:#5a5550;
      --card:#fff; --card-border:#e8e2d9;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    [hidden]{display:none !important}
    body{
      font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg);
      color:var(--dark); min-height:100vh;
      display:flex; flex-direction:column; align-items:center;
      padding:max(28px,env(safe-area-inset-top)) 20px 48px;
    }
    .top{width:100%;max-width:720px;display:flex;align-items:center;gap:14px;margin:4px 0 22px}
    .top a.back{color:var(--gold-dark);text-decoration:none;font-weight:700;font-size:.95rem;white-space:nowrap}
    .top h1{font-size:1.1rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dark)}
    .boxes{width:100%;max-width:720px;margin:0 0 22px}
    .boxes-title{font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
    .boxes-title:empty{display:none}
    .boxes .none{background:var(--card);border:2px dashed var(--card-border);border-radius:12px;padding:14px 16px;color:var(--muted);font-size:.9rem;margin:0 0 12px}
    .boxes .all{display:inline-block;margin-top:2px;color:var(--gold-dark);font-weight:700;font-size:.9rem;text-decoration:none}
    .grid{width:100%; max-width:720px; display:grid; grid-template-columns:repeat(2,1fr); gap:16px;}
    @media (max-width:560px){ .grid{grid-template-columns:1fr} }
    .tile{
      display:flex; flex-direction:column; gap:10px;
      background:var(--card); border:2px solid var(--card-border);
      border-radius:20px; padding:24px 22px; min-height:130px;
      color:var(--dark); text-decoration:none;
      transition:transform .15s ease, border-color .15s ease;
      position:relative; overflow:hidden;
    }
    .tile:hover{transform:translateY(-3px);border-color:var(--gold)}
    .tile .ic{font-size:2rem;line-height:1}
    .tile .ttl{font-size:1.12rem;font-weight:700}
    .tile .sub{font-size:.85rem;color:var(--muted);line-height:1.35}
    .tile .accent{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--gold)}
    .badge{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;letter-spacing:.06em;
      text-transform:uppercase;color:var(--gold-dark);background:#f6efe2;border-radius:999px;padding:3px 9px;width:max-content}
  </style>
</head>
<body>
  <div class="top">
    <a class="back" href="/salle.html">← Salle</a>
    <h1>Managers Salle</h1>
  </div>

  <!-- Résumé des check-lists manager : celles du service en cours (midi de 8h à 17h,
       soir le reste du temps), puis l'hebdo. Les tâches se cochent directement. -->
  <section class="boxes" id="boxes">
    <div class="boxes-title" id="boxes-title"></div>
    <div id="boxes-host"></div>
    <div class="none" id="boxes-none" hidden>Aucune check-list manager pour ce service.</div>
    <a class="all" href="/checklist/index.html?tab=manager">Toutes les check-lists manager →</a>
  </section>

  <main class="grid">
    <a class="tile" href="/checklist/rapports.html?scope=salle">
      <span class="accent"></span>
      <span class="ic">📊</span>
      <span class="ttl">Rapports check-list salle</span>
      <span class="sub">Historique des check-lists de la salle</span>
    </a>

    <a class="tile" href="/checklist/admin.html">
      <span class="accent"></span>
      <span class="ic">⚙️</span>
      <span class="badge">🔒 Protégé</span>
      <span class="ttl">Admin check-lists</span>
      <span class="sub">Gérer les check-lists et leurs tâches</span>
    </a>
  </main>

  <script>
    // Cartouches : check-lists manager du service en cours + hebdo.
    // Le service d'une check-list se lit dans son type ou son nom, comme sur la page
    // des check-lists : « Midi » / « Matin » → midi, « Soir » → soir, « Hebdo » → hebdo.
    window.CL_API_BASE = '/checklist/';
    window.CL_FROM = 'managers';
    window.CL_CATEGORY = 'manager';
    window.CL_BOX_CSS = true;
    (function () {
      var SLOTS = 6; // check-lists de service affichées au plus
      function svcOf(s) {
        var t = ((s.templateType || '') + ' ' + (s.templateName || '')).toUpperCase();
        if (t.indexOf('HEBDO') >= 0) return 'hebdo';
        if (t.indexOf('MIDI') >= 0 || t.indexOf('MATIN') >= 0) return 'midi';
        if (t.indexOf('SOIR') >= 0) return 'soir';
        return 'autre';
      }
      var icon = function (s) { return (s && s.templateIcon) || '👔'; };
      window.CL_BOXES = function () {
        var h = new Date().getHours();
        var svc = (h >= 8 && h < 17) ? 'midi' : 'soir';
        var el = document.getElementById('boxes-title');
        if (el) el.textContent = svc === 'midi' ? '🌞 Check-lists manager — service du midi' : '🌙 Check-lists manager — service du soir';
        var list = [];
        for (var i = 0; i < SLOTS; i++) {
          (function (n) {
            list.push({ id: 'box-svc-' + n, icon: icon, lines: 3, pick: function (all) { return all.filter(function (x) { return svcOf(x) === svc; })[n]; } });
          })(i);
        }
        list.push({ id: 'box-hebdo', icon: icon, lines: 3, pick: function (all) { return all.filter(function (x) { return svcOf(x) === 'hebdo'; })[0]; } });
        return list;
      };
      // Message quand aucune check-list n'est affichée.
      document.addEventListener('boxes-rendered', function () {
        var shown = document.querySelectorAll('#boxes-host .menage-box:not([hidden])').length;
        document.getElementById('boxes-none').hidden = shown > 0;
      });
    })();
  </script>
  <script src="/checklist/menage-box.js?v=5"></script>
  <script src="/tabbar.js?v=8"></script>
</body>
</html>
